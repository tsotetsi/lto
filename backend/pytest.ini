[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output by default
addopts = -v --tb=short --cov=services --cov=templates.models --cov=managers --cov-report=term

# Asyncio mode for async tests
asyncio_mode = auto

# Coverage config file
cov_config = .coveragerc
